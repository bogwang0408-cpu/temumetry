<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Temumetry Dash</title>
    <meta name="description" content="Authentic rhythm-based 2D platformer with original physics, speed portals, multi-mode gameplay, and synchronized electro tracks." />
    <meta property="og:title" content="Temumetry Dash" />
    <meta property="og:description" content="Authentic rhythm-based 2D platformer with original physics, speed portals, multi-mode gameplay, and synchronized electro tracks." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='10' fill='%2322E54C' stroke='%23070B14' stroke-width='5'/%3E%3Crect x='14' y='16' width='12' height='12' fill='%2300E5FF' stroke='%23070B14' stroke-width='3'/%3E%3Crect x='38' y='16' width='12' height='12' fill='%2300E5FF' stroke='%23070B14' stroke-width='3'/%3E%3Crect x='14' y='38' width='36' height='10' fill='%2300E5FF' stroke='%23070B14' stroke-width='3'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body, #app {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        font-family: 'Outfit', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background-color: #070B18;
        color: #ffffff;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font-family: inherit;
        color: inherit;
        cursor: pointer;
        border: none;
        background: none;
        padding: 0;
      }
      button:focus {
        outline: none;
      }
      button:focus-visible {
        outline: 2px solid #ffffff;
        outline-offset: 2px;
      }
      .font-mono-num {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-variant-numeric: tabular-nums;
      }
      .gd-outline {
        text-shadow:
          -2px -2px 0 #070B14,
          2px -2px 0 #070B14,
          -2px 2px 0 #070B14,
          2px 2px 0 #070B14,
          0 3px 0 #070B14;
      }
      .gd-outline-sm {
        text-shadow:
          -1.5px -1.5px 0 #070B14,
          1.5px -1.5px 0 #070B14,
          -1.5px 1.5px 0 #070B14,
          1.5px 1.5px 0 #070B14,
          0 2px 0 #070B14;
      }
      .screen {
        position: relative;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .bg-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .corner-trim {
        pointer-events: none;
        position: absolute;
        width: 80px;
        height: auto;
        z-index: 10;
      }
      @media (min-width: 640px) {
        .corner-trim { width: 112px; }
      }
      .corner-tl { top: 0; left: 0; }
      .corner-tr { top: 0; right: 0; transform: scale(-1, 1); }
      .corner-bl { bottom: 0; left: 0; transform: scale(1, -1); }
      .corner-br { bottom: 0; right: 0; transform: scale(-1, -1); }

      /* Lobby */
      .lobby-main {
        position: relative;
        z-index: 10;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px 16px 32px;
      }
      .lobby-title-wrap {
        width: 100%;
        max-width: 896px;
        padding: 0 8px;
        margin-bottom: 24px;
        display: flex;
        justify-content: center;
      }
      @media (min-width: 640px) {
        .lobby-title-wrap { margin-bottom: 40px; }
      }
      .lobby-title-svg {
        width: 100%;
        max-width: 780px;
        height: auto;
        overflow: visible;
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.5));
      }
      .lobby-buttons {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
      }
      @media (min-width: 640px) {
        .lobby-buttons { gap: 40px; }
      }
      .gd-stepped-btn {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: transform 0.14s ease;
      }
      .gd-stepped-btn:hover { transform: scale(1.05); }
      .gd-stepped-btn:active { transform: translateY(4px); }
      .gd-stepped-md { width: 88px; height: 88px; }
      .gd-stepped-lg { width: 128px; height: 128px; }
      @media (min-width: 640px) {
        .gd-stepped-md { width: 112px; height: 112px; }
        .gd-stepped-lg { width: 160px; height: 160px; }
      }
      .gd-stepped-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 7px 0 rgba(0, 0, 0, 0.8));
      }
      .gd-stepped-inner {
        position: relative;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lobby-footer {
        position: relative;
        z-index: 10;
        height: 24%;
        min-height: 88px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding-bottom: 8px;
      }
      @media (min-width: 640px) {
        .lobby-footer { gap: 28px; }
      }
      .gd-circle-btn {
        width: 56px;
        height: 56px;
        border-radius: 9999px;
        background: linear-gradient(180deg, #9BFF47 0%, #2EC41D 100%);
        border: 3px solid #000000;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.8), 0 5px 0 #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.14s ease;
      }
      @media (min-width: 640px) {
        .gd-circle-btn { width: 64px; height: 64px; }
      }
      .gd-circle-btn:hover { transform: scale(1.05); }
      .gd-circle-btn:active { transform: translateY(2px); }

      /* Back button */
      .gd-back-btn {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: transform 0.14s ease;
      }
      @media (min-width: 640px) {
        .gd-back-btn { width: 56px; height: 56px; }
      }
      .gd-back-btn:hover { transform: scale(1.05); }
      .gd-back-btn:active { transform: translateY(2px); }

      /* Modals */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(4px);
        padding: 16px;
      }
      .gd-modal-card {
        width: 100%;
        max-width: 448px;
        border-radius: 16px;
        background: #1A2952;
        border: 3px solid #000000;
        box-shadow: 0 12px 0 #000000;
        padding: 24px;
        color: #ffffff;
      }
      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      }
      .modal-title {
        margin: 0;
        font-size: 20px;
        font-weight: 900;
      }
      .modal-close-btn {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: #f43f5e;
        border: 2px solid #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
      }
      .modal-close-btn:hover { background: #fb7185; }
      .stat-grid {
        margin-top: 16px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .stat-box {
        border-radius: 12px;
        background: #0D1630;
        border: 2px solid #000000;
        padding: 14px;
      }
      .stat-label {
        font-size: 12px;
        color: #cbd5e1;
      }
      .stat-val {
        font-size: 24px;
        font-weight: 900;
        margin-top: 2px;
      }
      .settings-stack {
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .settings-row {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 12px;
        background: #0D1630;
        border: 2px solid #000000;
        padding: 12px 16px;
        font-weight: 700;
        font-size: 14px;
      }
      .settings-row:hover { background: #14224A; }
      .settings-row-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .controls-list {
        margin: 16px 0 0;
        padding: 12px 0 0;
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 12px;
        color: #e2e8f0;
      }

      /* Icon Kit */
      .iconkit-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: #ffffff;
        overflow: hidden;
        background: linear-gradient(180deg, #4E545E 0%, #828894 46%, #454A53 100%);
      }
      .iconkit-header {
        position: relative;
        z-index: 20;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        padding: 12px 16px 0;
      }
      @media (min-width: 640px) {
        .iconkit-header { padding: 16px 24px 0; }
      }
      .iconkit-counters {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        padding: 4px 8px 0 0;
        font-size: 14px;
        font-weight: 900;
      }
      @media (min-width: 640px) {
        .iconkit-counters { font-size: 16px; padding-right: 24px; }
      }
      .counter-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .counter-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: 9999px;
        border: 1.5px solid #000000;
        font-size: 11px;
        font-weight: 900;
      }
      .iconkit-main {
        position: relative;
        z-index: 10;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 12px;
      }
      @media (min-width: 640px) {
        .iconkit-main { padding: 0 32px; }
      }
      .pedestal-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 12px;
      }
      @media (min-width: 640px) {
        .pedestal-wrap { margin-bottom: 16px; }
      }
      .pedestal-stage {
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      @media (min-width: 640px) {
        .pedestal-stage { height: 96px; }
      }
      .pedestal-line {
        width: 256px;
        height: 2.5px;
        background: linear-gradient(90deg, transparent, #ffffff, transparent);
        opacity: 0.9;
      }
      @media (min-width: 640px) {
        .pedestal-line { width: 384px; }
      }
      .mode-tabs {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      @media (min-width: 640px) {
        .mode-tabs { gap: 12px; }
      }
      .mode-tab-btn {
        width: 40px;
        height: 40px;
        border-radius: 9999px;
        border: 2.5px solid #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #8A919E 0%, #464B54 100%);
        box-shadow: 0 3px 0 #000000;
        transition: transform 0.12s ease;
      }
      @media (min-width: 640px) {
        .mode-tab-btn { width: 48px; height: 48px; }
      }
      .mode-tab-btn:hover {
        background: linear-gradient(180deg, #9EA5B2 0%, #565C66 100%);
      }
      .mode-tab-btn:active { transform: translateY(2px); }
      .mode-tab-btn.active {
        background: linear-gradient(180deg, #4EE8FF 0%, #0094D6 100%);
        box-shadow: 0 0 0 2px #7DF2FF, 0 3px 0 #000000, 0 0 12px rgba(0, 229, 255, 0.65);
        transform: scale(1.05);
      }
      .glow-tab-btn.active {
        background: linear-gradient(180deg, #FFE854 0%, #E69000 100%);
        box-shadow: 0 0 0 2px #fde68a, 0 3px 0 #000000;
      }
      .tray-row {
        width: 100%;
        max-width: 768px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      @media (min-width: 640px) {
        .tray-row { gap: 16px; }
      }
      .tri-arrow-btn {
        width: 32px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: transform 0.12s ease;
      }
      @media (min-width: 640px) {
        .tri-arrow-btn { width: 40px; height: 44px; }
      }
      .tri-arrow-btn:hover:not(:disabled) { transform: scale(1.1); }
      .tri-arrow-btn:active:not(:disabled) { transform: translateY(2px); }
      .tri-arrow-btn:disabled { opacity: 0.35; cursor: default; }

      .icon-grid-box {
        flex: 1;
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.48);
        border: 1px solid rgba(0, 0, 0, 0.5);
        padding: 10px;
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.45);
      }
      @media (min-width: 640px) {
        .icon-grid-box { padding: 14px; }
      }
      .icon-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      @media (min-width: 640px) {
        .icon-grid { grid-template-columns: repeat(8, minmax(0, 1fr)); }
      }
      .skin-cell {
        position: relative;
        aspect-ratio: 1 / 1;
        border-radius: 8px;
        border: 2px solid rgba(0, 0, 0, 0.8);
        background: #262B34;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.12s ease, background-color 0.12s ease;
      }
      .skin-cell:hover {
        transform: scale(1.05);
        background: #313844;
      }
      .skin-cell.active {
        background: #3B424E;
        border-color: #000000;
      }
      .reticle {
        pointer-events: none;
        position: absolute;
        inset: -2px;
        z-index: 10;
      }
      .reticle i {
        position: absolute;
        width: 10px;
        height: 10px;
        border-color: #ffffff;
        border-style: solid;
        border-width: 0;
        filter: drop-shadow(0 1px 0 #000000);
      }
      .reticle i.tl { top: 0; left: 0; border-top-width: 2.5px; border-left-width: 2.5px; }
      .reticle i.tr { top: 0; right: 0; border-top-width: 2.5px; border-right-width: 2.5px; }
      .reticle i.bl { bottom: 0; left: 0; border-bottom-width: 2.5px; border-left-width: 2.5px; }
      .reticle i.br { bottom: 0; right: 0; border-bottom-width: 2.5px; border-right-width: 2.5px; }

      .color-tray-footer {
        position: relative;
        z-index: 20;
        background: rgba(0, 0, 0, 0.95);
        border-top: 3px solid #000000;
        padding: 10px 12px 8px;
      }
      @media (min-width: 640px) {
        .color-tray-footer { padding: 10px 24px 8px; }
      }
      .color-rows {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      @media (min-width: 640px) {
        .color-rows { gap: 8px; }
      }
      .color-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 6px;
      }
      @media (min-width: 640px) {
        .color-grid { grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; }
      }
      .color-swatch {
        position: relative;
        aspect-ratio: 1 / 1;
        width: 100%;
        max-width: 36px;
        margin: 0 auto;
        border-radius: 4px;
        border: 1px solid rgba(0, 0, 0, 0.8);
        transition: transform 0.12s ease;
      }
      .color-swatch:hover { transform: scale(1.1); }
      .page-dots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 8px;
      }
      .page-dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.35);
      }
      .page-dot:hover { background: rgba(255, 255, 255, 0.6); }
      .page-dot.active { background: #ffffff; }

      /* Level Select */
      .ls-header {
        position: relative;
        z-index: 20;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        padding: 12px 16px 0;
      }
      @media (min-width: 640px) {
        .ls-header { padding: 16px 24px 0; }
      }
      .ls-crown-wrap {
        margin-top: -12px;
        pointer-events: none;
      }
      @media (min-width: 640px) {
        .ls-crown-wrap { margin-top: -16px; }
      }
      .ls-crown-svg {
        width: 224px;
        height: auto;
        display: block;
      }
      @media (min-width: 640px) {
        .ls-crown-svg { width: 320px; }
      }
      @media (min-width: 768px) {
        .ls-crown-svg { width: 384px; }
      }
      .ls-info-btn {
        width: 44px;
        height: 44px;
        border-radius: 9999px;
        background: linear-gradient(180deg, #4EE8FF 0%, #007AD6 100%);
        border: 3px solid #000000;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.8), 0 4px 0 #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 20px;
        flex-shrink: 0;
        transition: transform 0.14s ease;
      }
      @media (min-width: 640px) {
        .ls-info-btn { width: 48px; height: 48px; }
      }
      .ls-info-btn:hover { transform: scale(1.05); }
      .ls-info-btn:active { transform: translateY(2px); }

      .ls-main {
        position: relative;
        z-index: 10;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 12px 8px;
      }
      @media (min-width: 640px) {
        .ls-main { padding: 0 32px 8px; }
      }
      .ls-stage-row {
        width: 100%;
        max-width: 768px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      @media (min-width: 640px) {
        .ls-stage-row { gap: 20px; }
      }
      .white-nav-arrow {
        width: 40px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: transform 0.14s ease;
      }
      @media (min-width: 640px) {
        .white-nav-arrow { width: 48px; height: 64px; }
      }
      .white-nav-arrow:hover { transform: scale(1.1); }
      .white-nav-arrow:active { transform: translateY(2px); }

      .level-banner {
        flex: 1;
        min-width: 0;
        text-align: left;
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.48);
        border: 1px solid rgba(0, 0, 0, 0.45);
        padding: 20px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        transition: background-color 0.15s ease, transform 0.12s ease;
      }
      @media (min-width: 640px) {
        .level-banner { padding: 28px 32px; }
      }
      .level-banner:hover { background: rgba(0, 0, 0, 0.58); }
      .level-banner:active { transform: scale(0.99); }
      .banner-stars {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        margin-bottom: 4px;
      }
      .banner-center {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin: 4px 0;
      }
      @media (min-width: 640px) {
        .banner-center { gap: 20px; margin: 8px 0; }
      }
      .banner-title {
        margin: 0;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      @media (min-width: 640px) {
        .banner-title { font-size: 36px; }
      }
      @media (min-width: 768px) {
        .banner-title { font-size: 48px; }
      }
      .banner-bottom {
        margin-top: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .coin-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      @media (min-width: 640px) {
        .coin-row { gap: 8px; }
      }
      .coin-slot {
        width: 28px;
        height: 28px;
        border-radius: 9999px;
        border: 2px solid #000000;
        box-shadow: 0 2px 0 #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 900;

  var LevelBuilder = class {
    constructor() {
      this.objects = [];
      this.nextId = 1;
    }
    add(type, x, y, w = 1, h = 1, coinIndex) {
      this.objects.push({
        id: this.nextId++,
        type,
        x,
        y,
        w,
        h,
        coinIndex
      });
      return this;
    }
    row(x, y, count, type = "block") {
      for (let i = 0; i < count; i++) {
        this.add(type, x + i, y, 1, 1);
      }
      return this;
    }
    rect(x, y, w, h, type = "block") {
      for (let dx = 0; dx < w; dx++) {
        for (let dy = 0; dy < h; dy++) {
          this.add(type, x + dx, y + dy, 1, 1);
        }
      }
      return this;
    }
    spikes(x, y, count, type = "spike") {
      for (let i = 0; i < count; i++) {
        this.add(type, x + i, y, 1, 1);
      }
      return this;
    }
    pillarUp(x, width, height, spikeTop = false) {
      this.rect(x, 0, width, height, "block_grid");
      if (spikeTop) {
        this.spikes(x, height, width, "spike");
      }
      return this;
    }
    pillarDown(x, width, depth, spikeBottom = false) {
      const startY = 10 - depth;
      this.rect(x, startY, width, depth, "block_grid");
      if (spikeBottom) {
        this.spikes(x, startY - 1, width, "spike_down");
      }
      return this;
    }
    gate(x, bottomH, topDepth, spikeEdges = false, width = 2) {
      if (bottomH > 0) this.pillarUp(x, width, bottomH, spikeEdges);
      if (topDepth > 0) this.pillarDown(x, width, topDepth, spikeEdges);
      return this;
    }
    /**
     * 45-degree Wave diagonal corridor.
     * channelH = air space between top of lower block and bottom of upper block.
     */
    waveCorridor(x, length, startFloorY, dir, channelH) {
      for (let i = 0; i < length; i++) {
        const fy = startFloorY + i * dir;
        if (fy >= 0.5 && fy <= 7.5) {
          this.add("block_grid", x + i, fy - 1, 1, 1);
        }
        const cy = fy + channelH;
        if (cy >= 1.5 && cy <= 9.5) {
          this.add("block_grid", x + i, cy, 1, 1);
        }
      }
      return this;
    }
    /** Dual symmetric saw gate centered at centerY with clear air gap */
    sawGate(x, centerY, gap) {
      const lowY = centerY - gap / 2 - 1;
      const highY = centerY + gap / 2;
      if (lowY >= 0) this.add("saw", x, lowY);
      if (highY <= 9) this.add("saw", x, highY);
      return this;
    }
    coin(x, y, index) {
      return this.add("coin", x, y, 1, 1, index);
    }
    build() {
      return this.objects;
    }
  };

        function drawVehiclePreview(canvas, customization, mode, size) {
          if (!canvas) return;
          var dpr = window.devicePixelRatio || 1;
          canvas.width = size * dpr;
          canvas.height = size * dpr;
          canvas.style.width = size + 'px';
          canvas.style.height = size + 'px';
          var ctx = canvas.getContext('2d');
          if (!ctx) return;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, size, size);
          if (mode === 'cube') G.drawCubeIcon(ctx, size / 2, size / 2, size * 0.72, 0, customization);
          else if (mode === 'ship') G.drawShipIcon(ctx, size / 2, size * 0.54, size * 0.68, 0, 1, customization);
          else if (mode === 'ball') G.drawBallIcon(ctx, size / 2, size / 2, size * 0.72, 0, customization);
          else if (mode === 'ufo') G.drawUfoIcon(ctx, size / 2, size * 0.54, size * 0.68, 0, 1, customization);
          else if (mode === 'robot') G.drawRobotIcon(ctx, size / 2, size * 0.54, size * 0.68, 0, true, 1, 0, customization);
          else if (mode === 'spider') G.drawSpiderIcon(ctx, size / 2, size * 0.54, size * 0.68, true, 1, 0, customization);
          else G.drawWaveIcon(ctx, size / 2, size / 2, size * 0.72, 0, customization);
        }

          var rafId = 0;

            x: 5, y: 0, vy: 0, speed: 9.0, mode: 'cube', rotation: 0,
            primary: state.saveData.customization.primaryColor,
            secondary: state.saveData.customization.secondaryColor,
          }];

          function drawBg(now) {
            rafId = requestAnimationFrame(drawBg);
            var dt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;
            camX += dt * 4.2;

            var canvas = document.getElementById('lobby-bg');
            if (!canvas) return;
            var rect = canvas.getBoundingClientRect();
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            var tw = Math.floor(rect.width * dpr);
            var th = Math.floor(rect.height * dpr);
            if (canvas.width !== tw || canvas.height !== th) {
              canvas.width = tw;
              canvas.height = th;
            }
            var ctx = canvas.getContext('2d');
            if (!ctx) return;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            var blockSize = Math.max(30, Math.min(48, Math.floor(rect.height / 14)));
            var groundH = Math.max(88, Math.floor(rect.height * 0.24));
            var floorY = rect.height - groundH;

            var bgGrad = ctx.createLinearGradient(0, 0, 0, floorY);
            bgGrad.addColorStop(0, '#6B079E');
            bgGrad.addColorStop(1, '#AC16D9');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, rect.width, rect.height);

            var tile = blockSize * 3.1;
            var offsetX = ((camX * blockSize * 0.25) % tile + tile) % tile;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.fillStyle = 'rgba(40, 0, 68, 0.20)';
            ctx.lineWidth = 2;
            for (var x = -offsetX; x < rect.width + tile; x += tile) {
              for (var y = floorY - tile; y > -tile; y -= tile) {
                ctx.fillRect(x + 6, y + 6, tile - 12, tile - 12);
                ctx.strokeRect(x + 6, y + 6, tile - 12, tile - 12);
              }
            }

            spawnTimer -= dt;
            if (spawnTimer <= 0) {
              spawnTimer = 1.8 + Math.random() * 1.8;
              var pair = DEMO_COLORS[Math.floor(Math.random() * DEMO_COLORS.length)];
              var modes = ['cube', 'cube', 'ship', 'ball'];
              var mode = modes[Math.floor(Math.random() * modes.length)];
              runners.push({
                x: -2,
                y: mode === 'ship' ? 2.5 + Math.random() * 3 : 0,
                vy: 0,
                speed: 7.5 + Math.random() * 4.0,
                mode: mode,
                rotation: 0,
                primary: pair[0],
                secondary: pair[1],
              });
            }

            var cust = state.saveData.customization;
            var maxBlocksX = rect.width / blockSize + 3;
            for (var i = runners.length - 1; i >= 0; i--) {
              var r = runners[i];
              r.x += r.speed * dt;
              if (r.mode === 'cube') {
                if (r.y <= 0.001 && Math.random() < dt * 1.0) r.vy = 18.5;
                r.vy -= 85 * dt;
                r.y += r.vy * dt;
                if (r.y <= 0) {
                  r.y = 0;
                  r.vy = 0;
                  r.rotation = Math.round(r.rotation / 90) * 90;
                } else {
                  r.rotation += 410 * dt;
                }
              } else if (r.mode === 'ship') {
                r.y += Math.sin(r.x * 0.4) * dt * 2.0;
                r.rotation = Math.cos(r.x * 0.4) * -14;
              } else {
                r.rotation += 480 * dt;
              }

              var sx = r.x * blockSize;
              var sy = floorY - (r.y + 0.5) * blockSize;
              var demoCust = Object.assign({}, cust, { primaryColor: r.primary, secondaryColor: r.secondary });
              if (r.mode === 'cube') G.drawCubeIcon(ctx, sx, sy, blockSize, r.rotation, demoCust);
              else if (r.mode === 'ship') G.drawShipIcon(ctx, sx, sy, blockSize, r.rotation, 1, demoCust);
              else G.drawBallIcon(ctx, sx, sy, blockSize, r.rotation, demoCust);
              if (r.x > maxBlocksX) runners.splice(i, 1);
            }
            G.drawGroundBand(ctx, 0, floorY, rect.width, groundH, camX, blockSize, '#560582', false);
          }

          rafId = requestAnimationFrame(drawBg);

          function onKeyDown(e) {
            if (state.lobbyModal) {

            }
          }
          window.addEventListener('keydown', onKeyDown);

          cleanupScreen = function () {
            cancelAnimationFrame(rafId);
            window.removeEventListener('keydown', onKeyDown);
          };
        }

          var rafId = 0;

            camX += dt * 3.4;

            var t = Math.min(1, dt * 8.5);
            curBg = lerpHex(curBg, targetBg, t);
            curGround = lerpHex(curGround, targetGround, t);

            var canvas = document.getElementById('ls-bg');

            var rect = canvas.getBoundingClientRect();
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            var tw = Math.floor(rect.width * dpr);
            var th = Math.floor(rect.height * dpr);
            if (canvas.width !== tw || canvas.height !== th) {
              canvas.width = tw;
              canvas.height = th;
            }
            var ctx = canvas.getContext('2d');
            if (!ctx) return;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            var blockSize = Math.max(30, Math.min(46, Math.floor(rect.height / 14)));
            var groundH = Math.max(76, Math.floor(rect.height * 0.19));
            var floorY = rect.height - groundH;

            var grad = ctx.createLinearGradient(0, 0, 0, floorY);
            grad.addColorStop(0, lerpHex(curBg, '#000000', 0.18));
            grad.addColorStop(1, curBg);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, rect.width, rect.height);

            var tile = blockSize * 3.2;
            var offset = ((camX * blockSize * 0.22) % tile + tile) % tile;
            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.lineWidth = 1.5;
            for (var x = -offset; x < rect.width + tile; x += tile) {
              for (var y = floorY - tile; y > -tile; y -= tile) {
                ctx.strokeRect(x + 6, y + 6, tile - 12, tile - 12);
              }
            }
            G.drawGroundBand(ctx, 0, floorY, rect.width, groundH, camX, blockSize, curGround, false);
          }
          rafId = requestAnimationFrame(drawBg);

          function onKeyDown(e) {
            if (state.showLevelInfo) {
              if (e.code === 'Escape') { state.showLevelInfo = false; renderInfoModal(); }
              return;
            }
            if (e.code === 'Escape') {
              state.screen = 'LOBBY';
              renderCurrentScreen();
            } else if (e.code === 'ArrowLeft') {
              state.selectedLevelIndex = (safeIdx() - 1 + LEVELS.length) % LEVELS.length;
              renderLevelContent();
            } else if (e.code === 'ArrowRight') {
              state.selectedLevelIndex = (safeIdx() + 1) % LEVELS.length;
              renderLevelContent();
            } else if (e.code === 'Enter' || e.code === 'Space') {
              e.preventDefault();
              startLevel(false);
            }
          }
          window.addEventListener('keydown', onKeyDown);

          cleanupScreen = function () {
            cancelAnimationFrame(rafId);
            window.removeEventListener('keydown', onKeyDown);
          };
        }

        // ==================== 3. GAME SCREEN ====================
        function mountGameScreen() {
          var level = state.activeSession.level;
          var practiceMode = state.activeSession.practice;
          var customization = state.saveData.customization;
          var paused = false;
          var progressPercent = 0;
          var attempt = 1;
          var checkpointCount = 0;
          var completeStats = null;
          var lastCommittedPct = -1;
          var sessionBestPct = 0;
          var input = { holding: false, justPressed: false, orbArmed: false };

          appEl.innerHTML =
            '<div class="game-screen">' +
            '<canvas id="game-canvas" class="game-canvas"></canvas>' +
            '<div class="hud-top">' +
            '<div class="hud-title-wrap">' +
            '<span class="hud-title">' + level.title + '</span>' +
            '<span id="hud-practice-tag" class="' + (practiceMode ? '' : 'hidden') + '" style="font-size:12px;font-weight:800;color:#67e8f9;text-shadow:0 1px 0 #000;white-space:nowrap">· Practice</span>' +
            '</div>' +
            '<div class="hud-progress-wrap">' +
            '<div class="hud-progress-track"><div id="hud-progress-fill" class="hud-progress-fill ' + (practiceMode ? 'practice' : 'normal') + '" style="width:0%"></div></div>' +
            '<span id="hud-progress-pct" class="hud-progress-pct font-mono-num">0%</span>' +
            '</div>' +
            '<div class="hud-actions">' +
            '<button id="hud-mute" class="hud-icon-btn"></button>' +
            '<button id="hud-pause" class="hud-icon-btn" aria-label="Pause game">' + svgIcon('pause', 16, 16) + '</button>' +
            '</div></div>' +
            '<div id="practice-bar" class="practice-controls ' + (practiceMode ? '' : 'hidden') + '">' +
            '<button id="cp-add" class="cp-add-btn">' + svgIcon('flag', 16, 16) + '<span>Checkpoint (Z)</span></button>' +
            '<button id="cp-del" class="cp-del-btn hidden" aria-label="Remove last checkpoint">' + svgIcon('trash2', 16, 16) + '<span>(X)</span></button>' +
            '</div>' +
            '<div id="game-overlay-root"></div>' +
            '</div>';

          if (document.activeElement && document.activeElement.blur) {
            document.activeElement.blur();
          }

          var engine = null;

          function commitBestProgress() {
            if (!engine) return;
            if (sessionBestPct > lastCommittedPct) {
              lastCommittedPct = sessionBestPct;
              updateLevelProgress(level.id, sessionBestPct, engine.practiceMode);
            }
          }

          function startAttemptMusic() {
            if (!engine) return;
            soundEngine.startMusic(level.id, level.bpm, engine.getEstimatedMusicOffset());
          }

          function refreshHud() {
            var fill = document.getElementById('hud-progress-fill');
            var pctEl = document.getElementById('hud-progress-pct');
            var tagEl = document.getElementById('hud-practice-tag');
            var pBar = document.getElementById('practice-bar');
            var delBtn = document.getElementById('cp-del');
            if (fill) {
              fill.style.width = progressPercent + '%';
              fill.className = 'hud-progress-fill ' + (practiceMode ? 'practice' : 'normal');
            }
            if (pctEl) pctEl.textContent = progressPercent + '%';
            if (tagEl) tagEl.className = practiceMode ? '' : 'hidden';
            if (pBar) pBar.className = 'practice-controls ' + (practiceMode && !paused && !completeStats ? '' : 'hidden');
            if (delBtn) delBtn.className = 'cp-del-btn ' + (checkpointCount > 0 ? '' : 'hidden');
          }

          function refreshGameMuteBtn() {
            var btn = document.getElementById('hud-mute');
            if (!btn) return;
            btn.setAttribute('aria-label', state.saveData.muted ? 'Unmute audio' : 'Mute audio');
            btn.innerHTML = svgIcon(state.saveData.muted ? 'volumeX' : 'volume2', 16, 16);
          }

          function renderOverlay() {
            var root = document.getElementById('game-overlay-root');
            if (!root) return;
            if (completeStats) {
              var coinsHtml = completeStats.coins.map(function (earned) {
                return '<div class="coin-slot ' + (earned ? 'earned' : '') + '" style="width:48px;height:48px;font-size:18px">★</div>';
              }).join('');
              root.innerHTML =
                '<div class="modal-backdrop" style="z-index:40;background:rgba(0,0,0,0.75)">' +
                '<div class="overlay-card overlay-card-lg">' +
                '<div style="margin:0 auto 12px;width:56px;height:56px;border-radius:16px;background:#FFD700;border:2px solid #000;box-shadow:0 4px 0 #000;display:flex;align-items:center;justify-content:center;color:#451a03">' + svgIcon('trophy', 28, 28) + '</div>' +
                '<h2 style="margin:0;font-size:30px;font-weight:900;color:#bef264;text-shadow:0 3px 0 #000">LEVEL COMPLETE!</h2>' +
                '<p style="margin:4px 0 0;font-size:14px;font-weight:700;color:#e2e8f0">' + level.title + ' ' + (practiceMode ? '(Practice Mode)' : '· 100%') + '</p>' +
                '<div style="margin-top:20px;display:flex;align-items:center;justify-content:center;gap:16px">' + coinsHtml + '</div>' +
                '<div class="stat-grid" style="margin-top:20px;text-align:left">' +
                '<div class="stat-box" style="background:#070B18;padding:12px 16px"><div class="stat-label" style="color:#94a3b8">Attempts</div><div class="stat-val font-mono-num" style="font-size:18px">' + completeStats.attempts + '</div></div>' +
                '<div class="stat-box" style="background:#070B18;padding:12px 16px"><div class="stat-label" style="color:#94a3b8">Jumps</div><div class="stat-val font-mono-num" style="font-size:18px">' + completeStats.jumps + '</div></div>' +
                '</div>' +
                '<div style="margin-top:24px;display:flex;gap:12px">' +
                '<button id="ov-retry" class="gd-action-btn btn-blue" style="flex:1">' + svgIcon('rotateCcw', 16, 16) + '<span>RETRY</span></button>' +
                '<button id="ov-levels" class="gd-action-btn btn-green" style="flex:1">' + svgIcon('home', 16, 16) + '<span>LEVELS</span></button>' +
                '</div></div></div>';
              document.getElementById('ov-retry').onclick = handleRestart;
              document.getElementById('ov-levels').onclick = exitToLevelSelect;
              return;
            }
            if (paused) {
              root.innerHTML =
                '<div class="modal-backdrop" style="z-index:30;background:rgba(0,0,0,0.7)">' +
                '<div class="overlay-card">' +
                '<h2 style="margin:0;font-size:24px;font-weight:900;text-shadow:0 2px 0 #000">' + level.title + '</h2>' +
                '<p class="font-mono-num" style="margin:4px 0 0;font-size:14px;font-weight:700;color:#a5f3fc">Progress ' + progressPercent + '% · Attempt ' + attempt + '</p>' +
                '<div style="margin-top:24px;display:flex;flex-direction:column;gap:12px">' +
                '<button id="ov-resume" class="gd-action-btn btn-green">' + svgIcon('play', 16, 16) + '<span>RESUME</span></button>' +
                '<button id="ov-practice" class="gd-action-btn ' + (practiceMode ? 'btn-cyan' : 'btn-blue') + '">' + svgIcon('flag', 16, 16) + '<span>' + (practiceMode ? 'PRACTICE: ON' : 'PRACTICE: OFF') + '</span></button>' +
                '<button id="ov-restart" class="gd-action-btn btn-orange">' + svgIcon('rotateCcw', 16, 16) + '<span>RESTART</span></button>' +
                '<button id="ov-exit" class="gd-action-btn btn-rose">' + svgIcon('home', 16, 16) + '<span>LEVEL SELECT</span></button>' +
                '</div></div></div>';
              document.getElementById('ov-resume').onclick = togglePause;
              document.getElementById('ov-practice').onclick = function () {
                practiceMode = !practiceMode;
                if (engine) {
                  engine.practiceMode = practiceMode;
                  if (!practiceMode) {
                    engine.checkpoints = [];
                    checkpointCount = 0;
                  }
                }
                refreshHud();
                renderOverlay();
              };
              document.getElementById('ov-restart').onclick = handleRestart;
              document.getElementById('ov-exit').onclick = exitToLevelSelect;
              return;
            }
            root.innerHTML = '';
          }

          function togglePause() {
            if (completeStats) return;
            paused = !paused;
            if (paused) {
              commitBestProgress();
              soundEngine.stopMusic();
              input.holding = false;
              input.orbArmed = false;
            } else if (engine && !engine.player.dead) {
              startAttemptMusic();
            }
            refreshHud();
            renderOverlay();
          }

          function handleRestart() {
            if (!engine) return;
            commitBestProgress();
            paused = false;
            completeStats = null;
            sessionBestPct = 0;
            engine.resetFull(true);
            attempt = 1;
            progressPercent = 0;
            checkpointCount = 0;
            refreshHud();
            renderOverlay();
          }

          function handlePlaceCheckpoint() {
            if (!engine || !practiceMode || paused || completeStats) return;
            if (engine.placeCheckpoint()) {
              checkpointCount = engine.checkpoints.length;
              refreshHud();
            }
          }

          function handleRemoveCheckpoint() {
            if (!engine || !practiceMode || paused || completeStats) return;
            if (engine.removeLastCheckpoint()) {
              checkpointCount = engine.checkpoints.length;
              refreshHud();
            }
          }

          function exitToLevelSelect() {
            commitBestProgress();
            soundEngine.stopMusic();
            state.activeSession = null;
            state.screen = 'LEVEL_SELECT';
            renderCurrentScreen();
          }

          engine = new G.GameEngine(level, customization, practiceMode, {
            onAttemptStart: function (att) {
              commitBestProgress();
              attempt = att;
              checkpointCount = engine.checkpoints.length;
              refreshHud();
              startAttemptMusic();
            },
            onProgress: function (pct) {
              progressPercent = pct;
              if (pct > sessionBestPct) sessionBestPct = pct;
              refreshHud();
            },
            onComplete: function (stats) {
              sessionBestPct = 100;
              progressPercent = 100;
              completeStats = stats;
              completeLevel(level.id, stats, engine.practiceMode);
              refreshHud();
              renderOverlay();
            },
          });

          refreshGameMuteBtn();
          refreshHud();
          startAttemptMusic();

          document.getElementById('hud-mute').onclick = function () {
            toggleMute();
            refreshGameMuteBtn();
          };
          document.getElementById('hud-pause').onclick = togglePause;
          document.getElementById('cp-add').onpointerdown = function (e) {
            e.stopPropagation();
            handlePlaceCheckpoint();
          };
          document.getElementById('cp-del').onpointerdown = function (e) {
            e.stopPropagation();
            handleRemoveCheckpoint();
          };

          var canvasEl = document.getElementById('game-canvas');
          canvasEl.onpointerdown = function (e) {
            if (e.button !== 0 && e.pointerType === 'mouse') return;
            if (paused) return;
            input.holding = true;
            input.justPressed = true;
            input.orbArmed = true;
          };
          function releasePointer() {
            input.holding = false;
            input.orbArmed = false;
          }
          canvasEl.onpointerup = releasePointer;
          canvasEl.onpointercancel = releasePointer;
          canvasEl.onpointerleave = releasePointer;

          function onKeyDown(e) {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
              e.preventDefault();
              if (!e.repeat && !paused) {
                input.holding = true;
                input.justPressed = true;
                input.orbArmed = true;
              }
            } else if (e.code === 'Escape' || e.code === 'KeyP') {
              e.preventDefault();
              togglePause();
            } else if (e.code === 'KeyR' && !e.repeat) {
              e.preventDefault();
              handleRestart();
            } else if (e.code === 'KeyZ' && !e.repeat) {
              handlePlaceCheckpoint();
            } else if (e.code === 'KeyX' && !e.repeat) {
              handleRemoveCheckpoint();
            }
          }
          function onKeyUp(e) {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
              input.holding = false;
              input.orbArmed = false;
            }
          }
          function onBlur() {
            input.holding = false;
            input.orbArmed = false;
          }

          window.addEventListener('keydown', onKeyDown);
          window.addEventListener('keyup', onKeyUp);
          window.addEventListener('blur', onBlur);

          var rafId = 0;
          var lastTime = performance.now();
          var accumulator = 0;
          function frame(now) {
            rafId = requestAnimationFrame(frame);
            var frameDt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;
            if (!paused) {
              accumulator += frameDt;
              while (accumulator >= G.FIXED_DT) {
                engine.stepFixed(G.FIXED_DT, input);
                accumulator -= G.FIXED_DT;
              }
            }
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            var cw = canvasEl.clientWidth || window.innerWidth;
            var ch = canvasEl.clientHeight || window.innerHeight;
            var targetW = Math.floor(cw * dpr);
            var targetH = Math.floor(ch * dpr);
            if (canvasEl.width !== targetW || canvasEl.height !== targetH) {
              canvasEl.width = targetW;
              canvasEl.height = targetH;
            }
            var ctx = canvasEl.getContext('2d');
            if (ctx) {
              ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
              G.renderGame(ctx, cw, ch, engine);
            }
          }
          rafId = requestAnimationFrame(frame);

          cleanupScreen = function () {
            cancelAnimationFrame(rafId);
            commitBestProgress();
            soundEngine.stopMusic();
            window.removeEventListener('keydown', onKeyDown);
            window.removeEventListener('keyup', onKeyUp);
            window.removeEventListener('blur', onBlur);
          };
        }

        renderCurrentScreen();
      })();
    </script>
  </body>
</html>
